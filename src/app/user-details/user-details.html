<mat-card class="details-card">

  <h1>User Details</h1>

  <div class="detail">
    <strong>First Name:</strong>
    <span>{{ firstName }}</span>
  </div>

  <div class="detail">
    <strong>Last Name:</strong>
    <span>{{ lastName }}</span>
  </div>

  <div class="detail">
    <strong>Email:</strong>
    <span>{{ email }}</span>
  </div>

  <div class="detail">
    <strong>Phone Number:</strong>
    <span>{{ phoneNumber }}</span>
  </div>

</mat-card>
